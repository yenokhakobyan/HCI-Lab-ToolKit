# HCI ToolKit — nginx site configuration
# Copy to /etc/nginx/sites-available/hci-toolkit and symlink to sites-enabled
#
# Replace YOUR_DOMAIN with your actual domain name.
# After setup, run: sudo certbot --nginx -d YOUR_DOMAIN

upstream hci_collector {
    server 127.0.0.1:8000;
}

upstream hci_dashboard {
    server 127.0.0.1:8502;
}

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Redirect HTTP to HTTPS (uncomment after certbot setup)
    # return 301 https://$host$request_uri;

    # --- Collector (FastAPI) ---
    location / {
        proxy_pass http://hci_collector;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Large file uploads (video chunks)
    client_max_body_size 100M;

    # --- Analytics Dashboard (Streamlit) ---
    location /analytics/ {
        proxy_pass http://hci_dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Streamlit uses WebSockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Streamlit static assets
    location /analytics/_stcore/ {
        proxy_pass http://hci_dashboard/_stcore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /analytics/static/ {
        proxy_pass http://hci_dashboard/static/;
    }
}

